[Prefix]

## Always responds with HTTP 200 OK for URLs matching these prefixes, effectively blocks public Web traffic towards these URLs.
## Add an empty prefix "" to mask all of the traffic.
# Setting type: UrlPrefixes
# Default value: ["https://download.illgames.jp/check/game/tos_check.php"]
